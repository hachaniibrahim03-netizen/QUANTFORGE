name: QUANTFORGE Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run mock provider smoke task
        env:
          PYTHONPATH: src
        run: python -m quantforge.task_runner --output artifacts/provider-smoke.json
      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-smoke-evidence
          path: artifacts/provider-smoke.json
          if-no-files-found: error
